<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARE BARE POSADA SPA RESTAURANT C.A.</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f5f5f4;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_CONFIG = {
      posadaName: 'BARE BARE POSADA SPA RESTAURANT C.A.',
      currencySymbol: '€',
      singleRate: 50,
      baseCoupleRate: 80,
      extraGuestRate: 20,
      rooms: [
        { id: '101', name: 'Habitación 101 - Suite Presidencial', capacity: 4, nightlyRate: 120, type: 'Suite' },
        { id: '102', name: 'Habitación 102 - Duplex Familiar', capacity: 8, nightlyRate: 200, type: 'Duplex' },
        { id: '103', name: 'Habitación 103 - Vista al Jardín', capacity: 3, nightlyRate: 80, type: 'Estándar' },
        { id: '104', name: 'Habitación 104 - Rincón Romántico', capacity: 2, nightlyRate: 80, type: 'Romántica' },
        { id: '105', name: 'Habitación 105 - Cabaña Rústica Duplex', capacity: 6, nightlyRate: 160, type: 'Duplex' }
      ]
    };

    const INITIAL_ROOM_BOOKINGS = [
      {
        id: 'res-1',
        roomId: '101',
        guestName: 'Carlos Mendoza',
        companionNames: 'María Mendoza, Ana Mendoza',
        idNumber: 'V-18.452.910',
        phone: '+584141112233',
        paxCount: 3,
        checkIn: new Date().toISOString().split('T')[0],
        checkOut: new Date(Date.now() + 2 * 86400000).toISOString().split('T')[0],
        totalAmount: 200,
        status: 'Confirmada',
        notes: 'Solicita cuna de bebé'
      },
      {
        id: 'res-2',
        roomId: '104',
        guestName: 'Valeria Gómez',
        companionNames: 'Roberto Silva',
        idNumber: 'E-84.120.399',
        phone: '+584125556677',
        paxCount: 2,
        checkIn: new Date(Date.now() + 86400000).toISOString().split('T')[0],
        checkOut: new Date(Date.now() + 3 * 86400000).toISOString().split('T')[0],
        totalAmount: 160,
        status: 'Confirmada',
        notes: 'Aniversario de bodas'
      }
    ];

    const INITIAL_EVENTS = [
      {
        id: 'evt-1',
        title: 'Boda Civil Familia Pérez',
        eventType: 'Boda',
        date: new Date(Date.now() + 4 * 86400000).toISOString().split('T')[0],
        paxCount: 45,
        contactName: 'Elena Pérez',
        contactPhone: '+58 414 1234567',
        notes: 'Montaje de sillas en Patio Central y Brindis'
      }
    ];

    const syncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('posada_realtime_sync') : null;

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const isGuestModeParam = urlParams.get('mode') === 'guest';
      const initialHab = urlParams.get('hab') || '';

      const [isStrictGuest] = useState(isGuestModeParam);
      const [viewMode, setViewMode] = useState(isGuestModeParam ? 'guest' : 'admin');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState('room');
      const [isLinkModalOpen, setIsLinkModalOpen] = useState(false);
      const [selectedRoomForLink, setSelectedRoomForLink] = useState('');

      const [editingItem, setEditingItem] = useState(null);
      const [bookingConflict, setBookingConflict] = useState(null);

      const [posadaConfig, setPosadaConfig] = useState(() => {
        const saved = localStorage.getItem('posada_config');
        return saved ? JSON.parse(saved) : INITIAL_CONFIG;
      });

      const [roomBookings, setRoomBookings] = useState(() => {
        const saved = localStorage.getItem('posada_room_bookings');
        return saved ? JSON.parse(saved) : INITIAL_ROOM_BOOKINGS;
      });

      const [eventBookings, setEventBookings] = useState(() => {
        const saved = localStorage.getItem('posada_event_bookings');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      const sincronizarReservasAdmin = async () => {
         try {
      const respuesta = await fetch('https://agentesingenieriadigitalplus-n8n.o9lcit.easypanel.host/webhook/07bb6e80-5ae0-4c04-83b8-5aed2612d1af');
         if (respuesta.ok) {
      const datosReservas = await respuesta.json();
      if (Array.isArray(datosReservas) && datosReservas.length > 0) {
        const reservasActualizadas = datosReservas.map(item => item.json || item);
        setRoomBookings(reservasActualizadas);
      }
    }
  } catch (error) {
    console.error('Error al sincronizar con Google Sheets:', error);
  }
};

React.useEffect(() => {
  sincronizarReservasAdmin();
}, []);

      const [guestForm, setGuestForm] = useState({
        roomId: initialHab || INITIAL_CONFIG.rooms[0]?.id || '101',
        guestName: '',
        companionNames: '',
        idNumber: '',
        phone: '',
        paxCount: 2,
        checkIn: new Date().toISOString().split('T')[0],
        checkOut: new Date(Date.now() + 86400000).toISOString().split('T')[0],
        notes: ''
      });

      const [toastMessage, setToastMessage] = useState(null);
      const [selectedDayDetails, setSelectedDayDetails] = useState(null);

      const [rangeStartDate, setRangeStartDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [rangeEndDate, setRangeEndDate] = useState(() => {
        const d = new Date();
        d.setDate(d.getDate() + 7);
        return d.toISOString().split('T')[0];
      });
      const [monthlyYearMonth, setMonthlyYearMonth] = useState(() => new Date().toISOString().slice(0, 7));

      const [newRoomForm, setNewRoomForm] = useState({ name: '', capacity: 2, nightlyRate: 80, type: 'Estándar' });

      const [roomForm, setRoomForm] = useState({
        roomId: INITIAL_CONFIG.rooms[0]?.id || '101',
        guestName: '',
        companionNames: '',
        idNumber: '',
        phone: '',
        paxCount: 2,
        checkIn: new Date().toISOString().split('T')[0],
        checkOut: new Date(Date.now() + 86400000).toISOString().split('T')[0],
        notes: ''
      });

      const [eventForm, setEventForm] = useState({
        eventType: 'Boda',
        date: new Date().toISOString().split('T')[0],
        contactName: '',
        contactPhone: '',
        paxCount: 30
      });

      useEffect(() => {
        localStorage.setItem('posada_config', JSON.stringify(posadaConfig));
      }, [posadaConfig]);

      useEffect(() => {
        localStorage.setItem('posada_room_bookings', JSON.stringify(roomBookings));
      }, [roomBookings]);

      useEffect(() => {
        localStorage.setItem('posada_event_bookings', JSON.stringify(eventBookings));
      }, [eventBookings]);

      useEffect(() => {
        const reloadData = () => {
          const savedBookings = localStorage.getItem('posada_room_bookings');
          if (savedBookings) setRoomBookings(JSON.parse(savedBookings));
          const savedEvents = localStorage.getItem('posada_event_bookings');
          if (savedEvents) setEventBookings(JSON.parse(savedEvents));
        };

        const handleStorage = (e) => {
          if (e.key === 'posada_room_bookings' || e.key === 'posada_event_bookings') {
            reloadData();
            showToast('🔔 ¡Información sincronizada en tiempo real!', 'info');
          }
        };

        window.addEventListener('storage', handleStorage);
        if (syncChannel) {
          syncChannel.onmessage = (event) => {
            if (event.data === 'UPDATE_BOOKINGS' || event.data === 'UPDATE_EVENTS') {
              reloadData();
              showToast('🔔 ¡Nueva reserva sincronizada en tiempo real!', 'info');
            }
          };
        }
        return () => window.removeEventListener('storage', handleStorage);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const notifyBroadcastSync = (msgType) => {
        if (syncChannel) syncChannel.postMessage(msgType);
      };

      const showToast = (msg, type = 'success') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      };

      const copyToClipboardSafe = (text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast('¡Enlace copiado al portapapeles!');
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      };

      const fallbackCopy = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('¡Enlace copiado al portapapeles!');
        } catch (err) {
          showToast('No se pudo copiar el enlace', 'error');
        }
        document.body.removeChild(textArea);
      };

      const roomCalculations = useMemo(() => {
        if (!roomForm.checkIn || !roomForm.checkOut) return { nights: 0, nightlyRate: 0, totalAmount: 0 };
        const start = new Date(roomForm.checkIn);
        const end = new Date(roomForm.checkOut);
        const nights = Math.max(0, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));
        const pax = Number(roomForm.paxCount) || 1;
        const selectedRoom = posadaConfig.rooms.find(r => r.id === roomForm.roomId);
        
        let baseRate = selectedRoom?.nightlyRate;
        if (!baseRate) {
          baseRate = pax === 1 ? (posadaConfig.singleRate || 50) : (posadaConfig.baseCoupleRate || 80);
        }
        const extraRate = posadaConfig.extraGuestRate || 20;
        let nightlyRate = baseRate;
        if (pax > 2 && !selectedRoom?.nightlyRate) {
          nightlyRate += (pax - 2) * extraRate;
        }
        return { nights, nightlyRate, totalAmount: nights * nightlyRate };
      }, [roomForm.checkIn, roomForm.checkOut, roomForm.paxCount, roomForm.roomId, posadaConfig]);

      const guestCalculations = useMemo(() => {
        if (!guestForm.checkIn || !guestForm.checkOut) return { nights: 0, nightlyRate: 0, totalAmount: 0 };
        const start = new Date(guestForm.checkIn);
        const end = new Date(guestForm.checkOut);
        const nights = Math.max(0, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));
        const pax = Number(guestForm.paxCount) || 1;
        const selectedRoom = posadaConfig.rooms.find(r => r.id === guestForm.roomId);
        
        let baseRate = selectedRoom?.nightlyRate;
        if (!baseRate) {
          baseRate = pax === 1 ? (posadaConfig.singleRate || 50) : (posadaConfig.baseCoupleRate || 80);
        }
        const extraRate = posadaConfig.extraGuestRate || 20;
        let nightlyRate = baseRate;
        if (pax > 2 && !selectedRoom?.nightlyRate) {
          nightlyRate += (pax - 2) * extraRate;
        }
        return { nights, nightlyRate, totalAmount: nights * nightlyRate };
      }, [guestForm.checkIn, guestForm.checkOut, guestForm.paxCount, guestForm.roomId, posadaConfig]);

      const checkRoomAvailability = (roomId, checkIn, checkOut, excludeBookingId = null) => {
        const conflicting = roomBookings.filter(b => {
          if (b.id === excludeBookingId) return false;
          if (b.roomId !== roomId) return false;
          return (checkIn < b.checkOut && checkOut > b.checkIn);
        });

        if (conflicting.length === 0) return { available: true };

        const alternativeRooms = posadaConfig.rooms.filter(r => {
          if (r.id === roomId) return false;
          return !roomBookings.some(b => b.id !== excludeBookingId && b.roomId === r.id && (checkIn < b.checkOut && checkOut > b.checkIn));
        });

        const latestConflictingCheckOut = conflicting.reduce((max, b) => b.checkOut > max ? b.checkOut : max, checkIn);
        const durationDays = Math.max(1, Math.ceil((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24)));
        const suggestedCheckIn = latestConflictingCheckOut;
        const suggestedCheckOutDate = new Date(suggestedCheckIn);
        suggestedCheckOutDate.setDate(suggestedCheckOutDate.getDate() + durationDays);

        return {
          available: false,
          conflicting,
          alternativeRooms,
          suggestedNextDates: { checkIn: suggestedCheckIn, checkOut: suggestedCheckOutDate.toISOString().split('T')[0] }
        };
      };

      const handleOpenCreateModal = (type) => {
        setEditingItem(null);
        setBookingConflict(null);
        setModalType(type);
        if (type === 'room') {
          setRoomForm({
            roomId: posadaConfig.rooms[0]?.id || '101',
            guestName: '',
            companionNames: '',
            idNumber: '',
            phone: '',
            paxCount: 2,
            checkIn: new Date().toISOString().split('T')[0],
            checkOut: new Date(Date.now() + 86400000).toISOString().split('T')[0],
            notes: ''
          });
        } else {
          setEventForm({ eventType: 'Boda', date: new Date().toISOString().split('T')[0], contactName: '', contactPhone: '', paxCount: 30 });
        }
        setIsModalOpen(true);
      };

      const handleEditRoomBooking = (booking) => {
        setEditingItem(booking);
        setBookingConflict(null);
        setModalType('room');
        setRoomForm({ ...booking, phone: booking.phone || '' });
        setIsModalOpen(true);
      };

      const handleEditEvent = (evt) => {
        setEditingItem(evt);
        setModalType('event');
        setEventForm({ ...evt });
        setIsModalOpen(true);
      };

      const handleSaveRoomBooking = (e) => {
        e.preventDefault();
        if (!roomForm.guestName || !roomForm.idNumber) return showToast('Ingrese nombre y cédula.', 'error');
        if (roomForm.checkIn >= roomForm.checkOut) return showToast('La fecha de salida debe ser posterior.', 'error');

        const availability = checkRoomAvailability(roomForm.roomId, roomForm.checkIn, roomForm.checkOut, editingItem?.id);
        if (!availability.available) {
          setBookingConflict(availability);
          return showToast('Habitación ocupada en esas fechas.', 'error');
        }

        let updated;
        if (editingItem) {
          updated = roomBookings.map(b => b.id === editingItem.id ? { ...b, ...roomForm, totalAmount: roomCalculations.totalAmount } : b);
          showToast('Reserva actualizada.');
        } else {
          const newBooking = { id: `res-${Date.now()}`, ...roomForm, totalAmount: roomCalculations.totalAmount, status: 'Confirmada' };
          updated = [newBooking, ...roomBookings];
          showToast('Reserva guardada.');
        }
        setRoomBookings(updated);
        localStorage.setItem('posada_room_bookings', JSON.stringify(updated));
        notifyBroadcastSync('UPDATE_BOOKINGS');
        setIsModalOpen(false);
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        if (!eventForm.eventType || !eventForm.contactName) return showToast('Complete los campos del evento.', 'error');

        let updated;
        if (editingItem) {
          updated = eventBookings.map(ev => ev.id === editingItem.id ? { ...ev, ...eventForm } : ev);
          showToast('Evento actualizado.');
        } else {
          const newEvt = { id: `evt-${Date.now()}`, ...eventForm };
          updated = [newEvt, ...eventBookings];
          showToast('Evento registrado.');
        }
        setEventBookings(updated);
        localStorage.setItem('posada_event_bookings', JSON.stringify(updated));
        notifyBroadcastSync('UPDATE_EVENTS');
        setIsModalOpen(false);
      };

      const handleDeleteBooking = (id) => {
        const updated = roomBookings.filter(b => b.id !== id);
        setRoomBookings(updated);
        localStorage.setItem('posada_room_bookings', JSON.stringify(updated));
        notifyBroadcastSync('UPDATE_BOOKINGS');
        showToast('Reserva eliminada.');
      };

      const handleDeleteEvent = (id) => {
        const updated = eventBookings.filter(e => e.id !== id);
        setEventBookings(updated);
        localStorage.setItem('posada_event_bookings', JSON.stringify(updated));
        notifyBroadcastSync('UPDATE_EVENTS');
        showToast('Evento eliminado.');
      };

      const handleAddRoom = (e) => {
        e.preventDefault();
        if (!newRoomForm.name.trim()) return;
        const newRoom = { id: String(Date.now()).slice(-4), ...newRoomForm };
        const updatedConfig = { ...posadaConfig, rooms: [...posadaConfig.rooms, newRoom] };
        setPosadaConfig(updatedConfig);
        localStorage.setItem('posada_config', JSON.stringify(updatedConfig));
        setNewRoomForm({ name: '', capacity: 2, nightlyRate: 80, type: 'Estándar' });
        showToast('Habitación agregada.');
      };

      const handleDeleteRoom = (id) => {
        if (posadaConfig.rooms.length <= 1) return showToast('Debe mantener al menos una habitación.', 'error');
        const updatedConfig = { ...posadaConfig, rooms: posadaConfig.rooms.filter(r => r.id !== id) };
        setPosadaConfig(updatedConfig);
        localStorage.setItem('posada_config', JSON.stringify(updatedConfig));
        showToast('Habitación eliminada.');
      };

      const handleGuestSubmit = async (e) => {
        e.preventDefault();
        if (!guestForm.guestName || !guestForm.idNumber || !guestForm.phone) {
          return showToast('Por favor complete su nombre, cédula y teléfono.', 'error');
        }
        if (guestForm.checkIn >= guestForm.checkOut) {
          return showToast('La fecha de salida debe ser posterior a la de entrada.', 'error');
        }

        const newBooking = {
          id: `res-${Date.now()}`,
          ...guestForm,
          totalAmount: guestCalculations.totalAmount,
          status: 'Confirmada',
          createdAt: new Date().toISOString()
        };

        try {
          const response = await fetch('https://agentesingenieriadigitalplus-n8n.o9lcit.easypanel.host/webhook/29b416d2-7c7a-44cd-a172-d342866c8752', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(newBooking)
          });

          if (response.ok) {
            showToast('¡Reserva confirmada y registrada en Google Sheets!');
            setViewMode('guest-success');
          } else {
            showToast('Hubo un error al registrar la reserva.', 'error');
          }
        } catch (error) {
          console.error('Error de red:', error);
          showToast('No se pudo conectar con el servidor.', 'error');
        }
      };

      const customRangeDays = useMemo(() => {
        if (!rangeStartDate || !rangeEndDate) return [];
        const days = [];
        let start = new Date(rangeStartDate + 'T00:00:00');
        const end = new Date(rangeEndDate + 'T00:00:00');
        if (start > end) return [];
        while (start <= end) {
          const dateStr = start.toISOString().split('T')[0];
          const dayLabel = start.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'numeric' });
          days.push({ dateStr, label: dayLabel });
          start.setDate(start.getDate() + 1);
        }
        return days;
      }, [rangeStartDate, rangeEndDate]);

      const monthCalendarGrid = useMemo(() => {
        const [year, month] = monthlyYearMonth.split('-').map(Number);
        if (!year || !month) return [];
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        const cells = [];

        for (let i = 0; i < adjustedFirstDay; i++) {
          cells.push({ empty: true, key: `empty-${i}` });
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateObj = new Date(year, month - 1, day);
          const dateStr = dateObj.toISOString().split('T')[0];
          const occupied = roomBookings.filter(b => b.checkIn <= dateStr && b.checkOut > dateStr);
          const totalRooms = posadaConfig.rooms.length;
          const freeRooms = Math.max(0, totalRooms - occupied.length);
          const pct = totalRooms > 0 ? Math.round((occupied.length / totalRooms) * 100) : 0;
          const dayEvents = eventBookings.filter(e => e.date === dateStr);

          cells.push({
            empty: false,
            day,
            dateStr,
            totalOccupied: occupied.length,
            freeRooms,
            totalRooms,
            dayOccupancyPercentage: pct,
            occupiedBookings: occupied,
            dayEvents,
            key: `day-${day}`
          });
        }
        return cells;
      }, [monthlyYearMonth, roomBookings, eventBookings, posadaConfig.rooms.length]);

      return (
        <div className="min-h-screen bg-stone-100 text-stone-900 flex flex-col pb-6">
          {toastMessage && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg border text-xs font-bold text-white ${
              toastMessage.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'
            }`}>
              {toastMessage.msg}
            </div>
          )}

          <header className="bg-stone-900 text-stone-100 shadow-md border-b border-stone-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 sm:w-10 sm:h-10 bg-amber-600 rounded-xl flex items-center justify-center font-serif font-bold text-base sm:text-lg text-white shadow shrink-0">
                  B
                </div>
                <div className="truncate">
                  <h1 className="font-serif text-sm sm:text-lg font-bold tracking-wide truncate">{posadaConfig.posadaName}</h1>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] sm:text-[11px] text-amber-400 font-medium">Sincronización en Tiempo Real</span>
                    <span className="inline-flex items-center gap-1 text-[9px] bg-emerald-950 text-emerald-400 px-1.5 py-0.2 rounded-full border border-emerald-800 font-mono">
                      EN VIVO
                    </span>
                  </div>
                </div>
              </div>

              {!isStrictGuest && (
                <div className="flex items-center space-x-2">
                  {viewMode === 'admin' ? (
                    <>
                      <button
                        onClick={() => setIsLinkModalOpen(true)}
                        className="bg-stone-800 hover:bg-stone-700 text-amber-400 border border-amber-600/40 text-xs font-bold px-3 py-2 rounded-xl flex items-center space-x-1.5 transition"
                      >
                        <span>🔗 Link Huésped</span>
                      </button>
                      <button
                        onClick={() => setViewMode('guest')}
                        className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-3 py-2 rounded-xl transition"
                      >
                        🌐 Ver Portal Huésped
                      </button>
                    </>
                  ) : (
                    <button
                      onClick={() => setViewMode('admin')}
                      className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition"
                    >
                      🔐 Volver a Admin
                    </button>
                  )}
                </div>
              )}
            </div>
          </header>

          {viewMode === 'admin' && !isStrictGuest ? (
            <>
              <nav className="bg-white border-b border-stone-200 shadow-xs sticky top-[57px] sm:top-[65px] z-20 hidden md:block">
                <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-1 py-1">
                  {[
                    { id: 'dashboard', label: 'Panel Principal' },
                    { id: 'weekly', label: 'Ocupación por Rango' },
                    { id: 'monthly', label: 'Calendario Mensual' },
                    { id: 'events', label: 'Eventos & Bodas' },
                    { id: 'admin', label: 'Gestión Habitaciones' },
                    { id: 'api', label: 'API n8n / IA' },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}

                <h2 className="font-serif text-2xl font-bold text-stone-900">¡Reserva Registrada con Éxito!</h2>
                <p className="text-xs text-stone-600 leading-relaxed">
                  Su solicitud ha sido enviada y sincronizada instantáneamente con el sistema de administración de <strong>{posadaConfig.posadaName}</strong>.
                </p>
                <div className="pt-4 flex flex-col gap-3">
                  <button
                    onClick={() => {
                      const msg = `Hola, he realizado una reserva en ${posadaConfig.posadaName}. Huésped: ${guestForm.guestName}, Habitación: ${posadaConfig.rooms.find(r => r.id === guestForm.roomId)?.name}, Fecha: ${guestForm.checkIn} al ${guestForm.checkOut}, Total: ${guestCalculations.totalAmount}€`;
                      copyToClipboardSafe(msg);
                    }}
                    className="w-full py-3 bg-emerald-700 text-white font-bold rounded-xl text-xs"
                  >
                    Copiar Resumen para WhatsApp
                  </button>
                  <button
                    onClick={() => setViewMode('guest')}
                    className="w-full py-3 bg-stone-100 text-stone-800 font-bold rounded-xl text-xs"
                  >
                    Hacer Otra Reserva
                  </button>
                </div>
              </div>
            </main>
          )}

          {isModalOpen && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-serif font-bold text-lg text-stone-800">
                    {editingItem ? 'Modificar Elemento' : modalType === 'room' ? 'Nueva Reserva de Habitación' : 'Registrar Evento'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-stone-400 font-bold text-sm">✕</button>
                </div>

                {modalType === 'room' ? (
                  <form onSubmit={handleSaveRoomBooking} className="space-y-4 text-xs">
                    {bookingConflict && (
                      <div className="bg-red-50 border border-red-200 p-3 rounded-xl space-y-2">
                        <p className="font-bold text-red-800">⚠️ Habitación ocupada en estas fechas.</p>
                        {bookingConflict.suggestedNextDates && (
                          <div className="bg-white p-2 rounded border flex justify-between items-center text-[11px]">
                            <span>Próxima fecha: {bookingConflict.suggestedNextDates.checkIn} al {bookingConflict.suggestedNextDates.checkOut}</span>
                            <button
                              type="button"
                              onClick={() => {
                                setRoomForm({ ...roomForm, checkIn: bookingConflict.suggestedNextDates.checkIn, checkOut: bookingConflict.suggestedNextDates.checkOut });
                                setBookingConflict(null);
                              }}
                              className="bg-amber-600 text-white px-2 py-1 rounded font-bold"
                            >
                              Usar
                            </button>
                          </div>
                        )}
                      </div>
                    )}

                    <div>
                      <label className="block font-semibold mb-1">Habitación *</label>
                      <select
                        value={roomForm.roomId}
                        onChange={e => { setRoomForm({ ...roomForm, roomId: e.target.value }); setBookingConflict(null); }}
                        className="w-full p-2.5 border rounded-xl bg-white font-medium"
                      >
                        {posadaConfig.rooms.map(r => (
                          <option key={r.id} value={r.id}>{r.name} ({r.capacity} pax - {r.nightlyRate}€/noche)</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold mb-1">Huésped *</label>
                        <input type="text" required value={roomForm.guestName} onChange={e => setRoomForm({...roomForm, guestName: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Cédula *</label>
                        <input type="text" required value={roomForm.idNumber} onChange={e => setRoomForm({...roomForm, idNumber: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold mb-1">Teléfono WhatsApp</label>
                        <input type="text" value={roomForm.phone} onChange={e => setRoomForm({...roomForm, phone: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Huéspedes (Pax)</label>
                        <input type="number" min="1" value={roomForm.paxCount} onChange={e => setRoomForm({...roomForm, paxCount: Number(e.target.value)})} className="w-full p-2.5 border rounded-xl" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold mb-1">Check-In *</label>
                        <input type="date" required value={roomForm.checkIn} onChange={e => { setRoomForm({...roomForm, checkIn: e.target.value}); setBookingConflict(null); }} className="w-full p-2.5 border rounded-xl" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Check-Out *</label>
                        <input type="date" required value={roomForm.checkOut} onChange={e => { setRoomForm({...roomForm, checkOut: e.target.value}); setBookingConflict(null); }} className="w-full p-2.5 border rounded-xl" />
                      </div>
                    </div>

                    <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 flex justify-between items-center">
                      <span className="font-bold text-amber-900">Total Noches: {roomCalculations.nights}</span>
                      <span className="text-base font-bold text-amber-900">{roomCalculations.totalAmount}€</span>
                    </div>

                    <button type="submit" className="w-full py-3 bg-amber-600 text-white font-bold rounded-xl">Guardar Reserva</button>
                  </form>
                ) : (
                  <form onSubmit={handleSaveEvent} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-semibold mb-1">Tipo de Evento *</label>
                      <select value={eventForm.eventType} onChange={e => setEventForm({...eventForm, eventType: e.target.value})} className="w-full p-2.5 border rounded-xl bg-white">
                        <option value="Boda">Boda</option>
                        <option value="Cumpleaños">Cumpleaños</option>
                        <option value="Corporativo">Corporativo</option>
                        <option value="Sesión Fotográfica">Sesión Fotográfica</option>
                        <option value="Otro">Otro</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Fecha *</label>
                      <input type="date" required value={eventForm.date} onChange={e => setEventForm({...eventForm, date: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold mb-1">Contacto *</label>
                        <input type="text" required value={eventForm.contactName} onChange={e => setEventForm({...eventForm, contactName: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1">Teléfono *</label>
                        <input type="text" required value={eventForm.contactPhone} onChange={e => setEventForm({...eventForm, contactPhone: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                      </div>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Invitados *</label>
                      <input type="number" min="1" value={eventForm.paxCount} onChange={e => setEventForm({...eventForm, paxCount: Number(e.target.value)})} className="w-full p-2.5 border rounded-xl" />
                    </div>
                    <button type="submit" className="w-full py-3 bg-purple-700 text-white font-bold rounded-xl">Registrar Evento</button>
                  </form>
                )}
              </div>
            </div>
          )}

          {isLinkModalOpen && (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-serif font-bold text-base text-stone-800">Generar Enlace para Huésped</h3>
                  <button onClick={() => setIsLinkModalOpen(false)} className="text-stone-400 font-bold text-sm">✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold mb-1">Preseleccionar Habitación (Opcional)</label>
                    <select
                      value={selectedRoomForLink}
                      onChange={e => setSelectedRoomForLink(e.target.value)}
                      className="w-full p-2.5 border rounded-xl bg-white"
                    >
                      <option value="">-- Enlace General (Cualquier Habitación) --</option>
                      {posadaConfig.rooms.map(r => (
                        <option key={r.id} value={r.id}>{r.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="bg-stone-50 p-3 rounded-xl border space-y-2">
                    <p className="font-bold text-stone-700">Enlace directo generado:</p>
                    <input
                      type="text"
                      readOnly
                      value={`${window.location.origin}${window.location.pathname}?mode=guest${selectedRoomForLink ? `&hab=${selectedRoomForLink}` : ''}`}
                      className="w-full p-2 border rounded bg-white font-mono text-[10px]"
                    />
                  </div>

                  <button
                    onClick={() => {
                      const link = `${window.location.origin}${window.location.pathname}?mode=guest${selectedRoomForLink ? `&hab=${selectedRoomForLink}` : ''}`;
                      const msg = `¡Hola! Bienvenido a ${posadaConfig.posadaName}. Puede realizar su reserva directamente ingresando a nuestro portal seguro en el siguiente enlace:\n\n${link}`;
                      copyToClipboardSafe(msg);
                    }}
                    className="w-full py-3 bg-amber-600 text-white font-bold rounded-xl"
                  >
                    Copiar Mensaje Completo para WhatsApp
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
